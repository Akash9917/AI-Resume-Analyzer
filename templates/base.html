
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Resume Analyzer{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #0b1120;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .main-navbar {
            background: #111827;
            padding: 14px 0;
            border-bottom: 1px solid #263650;
            box-shadow: 0 4px 20px rgba(0,0,0,.2);
        }

        .navbar-brand {
            font-size: 21px;
            letter-spacing: -.5px;
            color: #f8fafc !important;
        }

        .navbar-brand i {
            color: #60a5fa;
            margin-right: 8px;
        }

        .main-navbar .nav-link {
            color: #cbd5e1;
            font-weight: 500;
            padding: 10px 15px !important;
            border-radius: 8px;
            transition: .2s;
        }

        .main-navbar .nav-link:hover,
        .main-navbar .nav-link.active {
            color: white;
            background: #2563eb;
        }

        .main-footer {
            background: #111827;
            color: #cbd5e1;
            padding: 25px 0;
            margin-top: 45px;
            border-top: 1px solid #263650;
        }

        .footer-title {
            color: white;
            font-weight: 700;
            font-size: 17px;
        }

        .footer-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 0;
        }

        @media (max-width: 991px) {
            .main-navbar .nav-link { margin-top: 5px; }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark main-navbar">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
            <i class="bi bi-file-earmark-person"></i>
            AI Resume Analyzer
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                       href="{{ url_for('home') }}">
                        <i class="bi bi-house-door me-1"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'upload_resume' %}active{% endif %}"
                       href="{{ url_for('upload_resume') }}">
                        <i class="bi bi-cloud-upload me-1"></i> Upload Resume
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint in ['history', 'analysis_details', 'export_history'] %}active{% endif %}"
                       href="{{ url_for('history') }}">
                        <i class="bi bi-clock-history me-1"></i> Analysis History
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
                       href="{{ url_for('dashboard') }}">
                        <i class="bi bi-grid me-1"></i> Dashboard
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="main-footer">
    <div class="container">
        <div class="row align-items-center text-center text-md-start">

            <div class="col-md-6 mb-2 mb-md-0">
                <div class="footer-title">
                    <i class="bi bi-file-earmark-person me-2"></i>
                    AI Resume Analyzer
                </div>
                <p class="footer-subtitle mt-1">
                    Smart Resume Analysis & Job Matching System
                </p>
            </div>

            <div class="col-md-6 text-md-end">
                <p class="footer-subtitle">© 2026 AI Resume Analyzer</p>
                <p class="footer-subtitle mt-1">
                    BTech Final Year Project | 2023–2027
                </p>
            </div>

        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
